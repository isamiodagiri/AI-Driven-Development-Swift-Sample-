# .swiftlint.yml — 意味（アーキテクチャ不変条件・危険な書き方）を見る。
#
# 見た目は SwiftFormat（.swiftformat）が唯一の正である（docs/01-architecture.md §10-1）。
# ルール一覧と判定内容の正は docs/01-architecture.md §9-1 の表であり、本ファイルと同期させる。
# ルールを1つ足したら scripts/test-lint-rules.sh にも1件足す（§9-4）。
#
# 注意: match_kinds を使っていないため、コメントや文字列の中でも発火する（§9-3）。
# ルールを説明する文章はコードではなく docs/ に置くこと。

included:
  - Sources
  - Tests
  - App/Sources

excluded:
  - .build
  - App/.build-xcode

disabled_rules:
  # SwiftFormat と重なるもの（同じことを両方に見せない・§10-1）
  - line_length
  - trailing_whitespace
  - trailing_newline
  - colon
  - comma
  - opening_brace
  - closing_brace
  - statement_position
  - vertical_whitespace
  - control_statement
  - return_arrow_whitespace
  # 複数行リテラルの末尾カンマは SwiftFormat の trailingCommas が「付ける」ので、
  # SwiftLint の trailing_comma（「外す」）と正面から衝突する。整形側を正とする。
  - trailing_comma

# DesignSystem のトークン（xs / sm / md / lg / xl）は2文字で意味が通る名前である。
identifier_name:
  min_length:
    warning: 2
    error: 2

custom_rules:
  # ---- INV-3: 外界（URLSession / UserDefaults）に触れる層を固定する ----
  inv3_urlsession_outside_core_http:
    name: "INV-3 URLSession は Core/HTTP でだけ触る"
    regex: '\bURLSession\b'
    excluded: 'Sources/Core/HTTP/'
    message: "URLSession を直接触れるのは Core/HTTP だけである（docs/01-architecture.md §9-1）"
    severity: error

  inv3_userdefaults_outside_repository:
    name: "INV-3 UserDefaults は Repository でだけ触る"
    regex: '\bUserDefaults\b'
    excluded: 'Sources/Repository/'
    message: "UserDefaults を直接触れるのは Repository だけである（docs/01-architecture.md §9-1）"
    severity: error

  # ---- INV-4: 並行性の検査を手で黙らせない ----
  inv4_unchecked_sendable:
    name: "INV-4 @unchecked Sendable / nonisolated(unsafe) を書かない"
    regex: '@unchecked\s+Sendable|nonisolated\s*\(\s*unsafe\s*\)'
    message: "検査を黙らせず、値型・actor・let のみの保持で Sendable を満たす（docs/01-architecture.md §9-1）"
    severity: error

  # ---- INV-5: View / State は Entity を知らない ----
  inv5_domain_in_view_or_state:
    name: "INV-5 View / State は Domain を参照しない"
    regex: 'import\s+Domain\b'
    included: 'Feature/(View|State)/'
    message: "View / State が見るのは表示用の型だけである。Entity は ViewModel より内側で止める（docs/01-architecture.md §9-1）"
    severity: error

  # ---- INV-6: 色と寸法を View に直書きしない ----
  inv6_hardcoded_style_in_view:
    name: "INV-6 View に色・寸法を直書きしない"
    regex: '\bColor\s*\(|\bColor\.[a-z]|\.font\s*\(\s*\.system|\b(padding|frame|cornerRadius|offset|lineSpacing)\s*\([^)]*\b\d|\b(spacing|top|leading|bottom|trailing|width|height|radius)\s*:\s*-?\d'
    included: 'Feature/View/'
    message: "色と寸法は DesignSystem のトークン（AppColor / AppSpacing / AppSize / AppRadius）を使う（docs/01-architecture.md §9-1）"
    severity: error

  # ---- INV-9: View が参照する ViewModel は1つだけ・UseCase / Repository は見ない ----
  # 自分自身の型は宣言で必ず1回出るので、「異なる型が2つ以上」＝「自分以外を参照した」になる（§9-2）
  inv9_multiple_viewmodels_in_view:
    name: "INV-9 View が参照する ViewModel は1つだけ"
    regex: '(?s)\b([A-Z]\w*ViewModel)\b.*?\b(?!\1\b)([A-Z]\w*ViewModel)\b'
    included: 'Feature/View/'
    message: "1つの View が2つ以上の ViewModel を持つと、状態の出どころが画面から追えなくなる（docs/01-architecture.md §9-1）"
    severity: error

  inv9_usecase_or_repository_in_view:
    name: "INV-9 View は UseCase / Repository を直接参照しない"
    regex: '\b[A-Z]\w*(UseCase|Repository)\b'
    included: 'Feature/View/'
    message: "View が話す相手は ViewModel だけである（docs/01-architecture.md §9-1）"
    severity: error

  # ---- INV-10: View はロジックを持たない ----
  inv10_logic_in_view:
    name: "INV-10 View に加工・非同期・例外を書かない"
    regex: '\.(filter|sorted|reduce|compactMap|flatMap)\s*\(|\b(DateFormatter|NumberFormatter|RelativeDateTimeFormatter|Calendar)\b|\bTask\s*\{|\b(await|try|catch)\b'
    included: 'Feature/View/'
    message: "加工は Presentation / ViewModel、非同期は ViewModel より内側に置く（docs/01-architecture.md §9-1）"
    severity: error

  # ---- INV-11〜13: 同じ層のもの同士を参照しない（D-15）----
  inv11_other_viewmodel_in_viewmodel:
    name: "INV-11 ViewModel は他の ViewModel を参照しない"
    regex: '(?s)\b([A-Z]\w*ViewModel)\b.*?\b(?!\1\b)([A-Z]\w*ViewModel)\b'
    included: 'Feature/ViewModel/'
    message: "画面をまたぐ同期は Repository の通知で行う（docs/01-architecture.md §9-1）"
    severity: error

  inv12_other_usecase_in_usecase:
    name: "INV-12 UseCase は他の UseCase を参照しない"
    regex: '(?s)\b([A-Z]\w*UseCase)\b.*?\b(?!\1\b)([A-Z]\w*UseCase)\b'
    included: 'Sources/UseCase/'
    message: "UseCase を重ねると、どこまでが1つの操作か決まらなくなる（docs/01-architecture.md §9-1）"
    severity: error

  inv13_other_repository_in_repository:
    name: "INV-13 Repository は他の Repository を参照しない"
    regex: '(?s)\b([A-Z]\w*Repository)\b.*?\b(?!\1\b)([A-Z]\w*Repository)\b'
    included: 'Sources/Repository/'
    message: "Repository 同士の依存は、合成する側（AppComposition）で組む（docs/01-architecture.md §9-1）"
    severity: error
